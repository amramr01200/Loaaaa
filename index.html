<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AL BASHA LAOO</title><style>:root{--gold:#d4af37;--bg:#0d0d0d;--card:#171717;--line:#3b321c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{position:sticky;top:0;background:#111;border-bottom:1px solid var(--line);padding:14px;z-index:3}.brand{font-size:24px;font-weight:800;color:var(--gold)}.badge{display:inline-block;border:1px solid var(--gold);padding:4px 9px;border-radius:20px;margin:6px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.card h2{color:var(--gold);margin-top:0}button,input,select,textarea{font:inherit;border-radius:10px;padding:10px;margin:5px 0}button{background:var(--gold);border:0;color:#111;font-weight:700;cursor:pointer}input,select,textarea{width:100%;background:#0e0e0e;color:#fff;border:1px solid #555}nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}nav button{background:#252525;color:#fff;border:1px solid #555}nav button.active{background:var(--gold);color:#111}.muted{color:#aaa}.danger{color:#ff9b9b}.ok{color:#9be0ad}.hidden{display:none}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #333;text-align:right}th{color:var(--gold)}.stat{font-size:28px;color:var(--gold);font-weight:800}.login{max-width:420px;margin:10vh auto}.logo{font-size:34px;color:var(--gold);font-weight:900}</style></head><body><div class="top"><div class="wrap"><div class="brand">AL BASHA LAOO</div><span class="badge" id="roleBadge">تطبيق إدارة العقار</span></div></div><main class="wrap"><section id="login" class="login card"><div class="logo">AL BASHA LAOO</div><p class="muted">تسجيل الدخول إلى نظام إدارة البرج</p><input id="user" placeholder="اسم المستخدم"><input id="pass" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="loginMsg" class="danger"></p></section><section id="app" class="hidden"><div class="card"><h2>لوحة التحكم</h2><div class="grid"><div class="card"><div class="muted">الوحدات</div><div class="stat">40</div><small>38 شقة + 2 محل</small></div><div class="card"><div class="muted">المستحقات</div><div class="stat" id="dueStat">—</div></div><div class="card"><div class="muted">التحصيل</div><div class="stat" id="payStat">—</div></div><div class="card"><div class="muted">المصروفات</div><div class="stat" id="expStat">—</div></div></div></div><nav id="nav"></nav><div id="view"></div></section></main><script>const tabs=[['dash','لوحة التحكم'],['units','الوحدات'],['dues','المستحقات'],['pay','التسديد'],['exp','المصروفات'],['notes','الملاحظات'],['log','السجل'],['alert','الإنذارات']];let role=null;function login(){const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;document.getElementById('loginMsg').textContent='';if(!u||!p){document.getElementById('loginMsg').textContent='أدخل اسم المستخدم وكلمة المرور';return}role='owner';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('roleBadge').textContent='المالك — قراءة فقط';renderNav();show('dash')}function renderNav(){document.getElementById('nav').innerHTML=tabs.map(x=>`<button onclick="show('${x[0]}')">${x[1]}</button>`).join('')}function show(x){const v=document.getElementById('view');if(x==='dash')v.innerHTML='<div class="card"><h2>لوحة التحكم</h2><p>المالك يستطيع الاطلاع على جميع بيانات البرنامج دون تغييرها.</p><p class="ok">صلاحية المالك: قراءة فقط</p></div>';else if(x==='units')v.innerHTML='<div class="card"><h2>الوحدات</h2><p>الشقق من 1 إلى 38 + المحلين.</p><div class="table"><table><tr><th>الوحدة</th><th>المالك</th><th>الهاتف</th><th>الحالة</th></tr>'+Array.from({length:40},(_,i)=>`<tr><td>${i<38?i+1:(i===38?'محل 1':'محل 2')}</td><td>—</td><td>—</td><td>عرض فقط</td></tr>`).join('')+'</table></div></div>';else if(x==='dues')v.innerHTML=box('المستحقات','عرض إجمالي المستحقات وتفاصيلها حسب الوحدة.');else if(x==='pay')v.innerHTML=box('التسديد','عرض المدفوعات والتحصيلات السابقة فقط.');else if(x==='exp')v.innerHTML=box('المصروفات','عرض المصروفات وبنودها فقط.');else if(x==='notes')v.innerHTML=box('الملاحظات','عرض الملاحظات والإعلانات فقط.');else if(x==='log')v.innerHTML=box('سجل العمليات','عرض سجل العمليات بالكامل، بما فيه audit_log، للمالك قراءة فقط.');else v.innerHTML=box('الإنذارات','عرض الإنذارات وحالتها فقط.')}function box(t,d){return `<div class="card"><h2>${t}</h2><p>${d}</p><p class="muted">لا توجد صلاحية إضافة أو تعديل أو حذف من هذه الواجهة.</p></div>`}</script></body></html>
