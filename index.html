<style>

body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs) Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--sv),var(--card));border-bottom:3px solid var(--gold);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}

button{background:var(--sv);cursor:pointer;white-space:nowrap}button.on,button.p{background:var(--gold);color:#fff;border-color:var(--gold)}

.w{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--sv);padding:6px;text-align:right}th{color:var(--gold)}
.r{color:var(--red);font-weight:bold}.ok{color:var(--grn);font-weight:bold}.msg{background:var(--gold);color:#fff;padding:8px;border-radius:8px;margin:8px 0}

@media print{header,nav,button{display:none}}
</style>

 D.units=(await g('units')).sort((a,b)=>a.kind==b.kind?a.num-b.num:a.kind<b.kind?-1:1);D.dues=await g('dues');D.pay=await g('payments','paid_at');D.notes=await g('notes','created_at');

 const open=D.alerts.filter(a=>!a.dismissed),N=(staff()?[['dash','لوحة التحكم']]:[['mine','حسابي'],['dash','لوحة التحكم']]).concat([['units','الوحدات']],staff()?[['dues','المستحقات']]:[],[['pay','التسديد'],['exp','المصروفات'],['notes','الملاحظات'],['log','السجل'],['alert','إنذار'+(open.length?' ('+open.length+')':'')]],admin()?[['acc','الحسابات']]:[]);
 $('#alr').innerHTML=open.length?`<div class="msg" style="background:var(--red);position:sticky;top:0;z-index:9;cursor:pointer;margin:0;border-radius:0" onclick="TAB='alert';OUT='';PV=null;PS=null;draw()">⚠️ تنبيه: ${nm(open[0].unit_id)} حاولت التلاعب في بيانات النظام — ${T(open[0].last_at)}${open.length>1?' (+'+(open.length-1)+' إنذارات أخرى)':''}</div>`:'';
 $('#nav').innerHTML='<nav>'+N.map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';OUT='';PV=null;PS=null;draw()">${t[1]}</button>`).join('')+'</nav>';
 $('#app').innerHTML=(MSG?`<div class="msg">${E(MSG)}</div>`:'')+(ASK?askHtml():'')+(OUT?`<div class="card"><button onclick="print()">🖨 طباعة</button><button onclick="OUT='';draw()">إغلاق</button>${OUT}</div>`:'')+V[TAB]();MSG=''}
const obEdit=(l,fn,a,reason)=>OWN?`<button onclick='askAmt(${JSON.stringify(l)},${JSON.stringify(fn)},${JSON.stringify(a)},${!!reason})'>✎</button>`:'';
const obDel=(l,fn,a)=>OWN?`<button onclick='askDel(${JSON.stringify(l)},${JSON.stringify(fn)},${JSON.stringify(a)})'>🗑</button>`:'';

async function ownerGo(){if(BUSY||!ASK)return;const pw=$('#ow').value;if(!pw)return;const a={...ASK.args};
 if(ASK.amt){const v=Math.round(+$('#ov').value*100);if(!(v>0)){MSG='أدخل مبلغًا صحيحًا';draw();return}a.p_amount=v}
 if(ASK.reason)a.p_reason=$('#orr').value;const fn=ASK.fn;
 BUSY=true;const{data:{user}}=await sb.auth.getUser();const{error}=await sb.auth.signInWithPassword({email:user.email,password:pw});
 if(error){BUSY=false;ASK=null;MSG='كلمة المرور غير صحيحة';draw();return}
 ASK=null;const r=await rpc(fn,a);BUSY=false;if(r){MSG=r.d==null?'غير مصرح':'تم التنفيذ';await go()}}
const adjCard=()=>`<div class="card"><h2>👑 التسويات / الرصيد الافتتاحي</h2><div class="w"><table>${D.adj.map(a=>`<tr><td>${T(a.created_at)}</td><td>${P(a.amount)}</td><td>${E(a.reason)}</td><td>${obDel('مسح تسوية','fn_owner_delete_adjustment',{p_id:a.id})}</td></tr>`).join('')||'<tr><td>—</td></tr>'}</table></div></div>`;
let LIVE=null,LT=null,LI=null;
function startLive(){if(LIVE)return;try{LIVE=sb.channel('live');['dues','payments','expenses','alerts','units','notes','adjustments','audit_log','rounding_diffs'].forEach(t=>LIVE.on('postgres_changes',{event:'*',schema:'public',table:t},()=>soon()));LIVE.subscribe()}catch(e){}
 LI=setInterval(()=>{if(ME&&!document.hidden)soon()},30000)}

function soon(){clearTimeout(LT);LT=setTimeout(async()=>{if(!ME)return;if(BUSY){soon();return}
 await load();const a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!='button'&&a.type!='checkbox';
 const form=['dues','exp','notes'].includes(TAB)&&[...document.querySelectorAll('input:not([type=checkbox]):not([type=file]),textarea')].some(x=>x.value);
 if(!typing&&!PV&&!PS&&!form&&!ASK)draw()},600)}
async function go(){await load();MSG=MSG||'✓ تم التحديث';draw()}
const V={};
const isEl=i=>i.includes('الأسانسير'),bal=(k,b)=>D.dues.filter(d=>d.unit_id==k&&d.list==b).reduce((a,d)=>a+rem(d),0);
const pill=(c,t,k)=>`<button class="st ${c}" onclick="stm('${k}')">${t}</button>`;
const itemsOf=k=>ITEMS.concat([...new Set(D.dues.filter(d=>d.unit_id==k&&!ITEMS.includes(d.item)).map(d=>d.item))]);
const unitStat=k=>{const ds=D.dues.filter(d=>d.unit_id==k),t=ds.reduce((a,d)=>a+d.amount,0),pd=ds.reduce((a,d)=>a+d.paid,0),o=owed(k);if(!t)return '';if(o<=0)return pill('ok','✓ سدد بالكامل',k);if(pd>0)return pill('pt','◐ سداد جزئي',k);return pill('no','✗ لم يسدد',k)};
const itemDues=(k,item)=>D.dues.filter(d=>d.unit_id==k&&d.item==item).sort((a,b)=>new Date(a.created_at||a.due_date||0)-new Date(b.created_at||b.due_date||0));

const itemPaid=(k,item)=>itemDues(k,item).reduce((a,d)=>a+d.paid,0);

const itemStatus=(k,item)=>{
 const ds=itemDues(k,item), total=ds.reduce((a,d)=>a+d.amount,0), r=ds.reduce((a,d)=>a+rem(d),0), paid=ds.reduce((a,d)=>a+d.paid,0);
 if(!total)return '<span>—</span>';
 if(r<=0)return pill('ok','✓ سدد بالكامل',k);
 if(paid>0)return pill('pt','◐ سداد جزئي — مسدد '+P(paid)+' | متبقي '+P(r),k);

};

 const ds=itemDues(PS.k,PS.item), v=ds.reduce((a,d)=>a+rem(d),0);
 return `<div class="card" style="border:2px solid var(--gold)">

async function payItem(a){
 if(BUSY||!PS)return;
 if(!(a>0)){MSG='أدخل مبلغًا صحيحًا';draw();return}
 const ds=itemDues(PS.k,PS.item), total=ds.reduce((s,d)=>s+rem(d),0);
 if(a>total){MSG='مبلغ السداد أكبر من المتبقي في هذا البند';draw();return}
 BUSY=true;
 let left=a, last=null, note=$('#pn')?.value||null;
 for(const d of ds){
   if(left<=0)break;
   const x=Math.min(left,rem(d));
   if(x<=0)continue;
   const r=await rpc('fn_pay_due',{p_due_id:d.id,p_amount:x,p_note:note,p_idem:crypto.randomUUID()});
   if(!r||r.d==null){BUSY=false;return}
   last=r.d; left-=x;
 }
 BUSY=false;
 if(left>0){MSG='تعذر إكمال السداد بالكامل';await go();return}
 PS=null;const receipt=last&&typeof last==='object'?last.receipt_no:last;MSG='تم تسجيل السداد بنجاح'+(receipt?' — إيصال رقم '+receipt:'');await go();
}
V.dash=()=>{

 old=D.dues.filter(d=>d.list=='old').reduce((a,d)=>a+rem(d),0),

     </tr>`;
   }).join('');
   const total=owed(u.id);
   return `<tr><td colspan="6"><b>${nm(u.id)} — ${E(u.owner_name)}</b> | إجمالي المتبقي: <span class="${total>0?'r':'ok'}">${P(total)}</span> ${unitStat(u.id)} <button onclick="stm('${u.id}')">📄 كشف وإدارة</button>${staff()?`<button class="p" onclick="openAdd('${u.id}')">➕ مستحق</button>`:''}</td></tr>

 }).join('');

 <div class="k">ق/ المتبقي<b>${P(old)}</b></div><div class="k">إجمالي غير المحصّل<b class="r">${P(cur+old)}</b></div></div>
 ${staff()&&PS?payPanel():''}${staff()&&AD?addPanel():''}
 <div class="card"><h2>حالة السداد التفصيلية لكل شقة</h2>
 <p>يظهر هنا كل بند، وإجمالي المستحق، والمدفوع، والمتبقي، وحالة السداد. السداد الجزئي يُخصم من المستحق الفعلي للبند.</p>
 <div class="w"><table><tr><th>البند</th><th>المستحق</th><th>المسدد</th><th>المتبقي</th><th>الحالة</th><th>الإجراء</th></tr>${unitRows}</table></div></div>`;
};
V.units=()=>`<div class="card"><h2>الوحدات</h2><input id="q" placeholder="بحث" oninput="const q=this.value;document.querySelectorAll('#ut tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')"><div class="w"><table id="ut"><tr><th>الوحدة</th><th>المالك</th><th>الجوال</th><th></th></tr>${D.units.map(u=>`<tr data-s="${E(nm(u.id)+u.owner_name+u.phone)}"><td>${nm(u.id)}</td>${staff()?`<td><input id="o${u.id}" value="${E(u.owner_name)}"></td><td><input id="p${u.id}" value="${E(u.phone)}" dir="ltr"></td><td><button onclick="eu('${u.id}')">حفظ</button><button onclick="stm('${u.id}')">كشف</button></td>`:`<td>${E(u.owner_name)}</td><td dir="ltr">${E(u.phone)}</td><td><button onclick="stm('${u.id}')">كشف</button></td>`}</tr>`).join('')}</table></div></div>`;

const newPV=()=>({item:ITEMS[0],t:'',m:new Date().toISOString().slice(0,7),s:'',xs:[],sh:{}});
const pvInit=()=>{if(!PV)PV=newPV();return ''};
function pvCalc(){
 const t=Math.round((+PV.t||0)*100),all=D.units.filter(u=>u.kind==='apartment');
 const fixed=u=>isEl(PV.item)&&(u.num<4||u.num>38);
 const exIds=PV.xs.map(x=>x.id);
 const ls=PV.s?all.filter(u=>u.id===PV.s):all.filter(u=>!fixed(u)&&!exIds.includes(u.id));
 const n=ls.length,sh=n?Math.ceil(t/n):0,rd=PV.s?t:Math.ceil(sh/1000)*1000;
 const cr=D.dues.filter(d=>d.list==='current'&&d.item===PV.item&&(!PV.s||d.unit_id===PV.s)).reduce((a,d)=>a+rem(d),0);
 return{t,n,sh,rd,diff:PV.s?0:rd*n-t,cr,fixed:all.filter(fixed)}}
const sumHtml=c=>c.t>0&&c.n?`<p>سيُقسَّم <b>${P(c.t)}</b> على <b>${c.n}</b> شقة | النصيب قبل التقريب ${P(c.sh)} | بعد التقريب بالزيادة للعشرة <b>${P(c.rd)}</b> لكل شقة${c.diff?' | فرق التقريب '+P(c.diff):''}</p>`:'<p><small>اكتب الإجمالي ليظهر ملخص التقسيم.</small></p>';
function dvSum(){const e=$('#dvsum');if(e)e.innerHTML=sumHtml(pvCalc())}
const dvCard=()=>{
 const c=pvCalc(),all=D.units.filter(u=>u.kind==='apartment'),exIds=PV.xs.map(x=>x.id);
 const cand=all.filter(u=>!exIds.includes(u.id)&&!(isEl(PV.item)&&(u.num<4||u.num>38)));
 return `<div class="card"><h2>إصدار مستحقات ح/</h2>
<select id="di" onchange="PV.item=this.value;draw()">${ITEMS.map(x=>`<option ${x==PV.item?'selected':''}>${x}</option>`).join('')}</select>

${PV.s?'':`<h3>المستثنى من التقسيم</h3>

<input id="xw" placeholder="سبب الاستثناء (اختياري)">
<button onclick="addEx()">➕ إضافة للمستثنين</button>
${PV.xs.length?`<div class="w"><table><tr><th>الشقة</th><th>المالك</th><th>السبب</th><th></th></tr>${PV.xs.map(x=>`<tr><td>${nm(x.id)}</td><td>${E((D.units.find(u=>u.id==x.id)||{}).owner_name||'')}</td><td>${E(x.why)||'—'}</td><td><button onclick="rmEx('${x.id}')">✕</button></td></tr>`).join('')}</table></div>`:'<p><small>لا يوجد مستثنى — ستُقسَّم على كل الشقق المشاركة.</small></p>'}
${c.fixed.length?`<p><small>خارج نطاق هذا البند تلقائيًا: ${c.fixed.map(u=>nm(u.id)).join('، ')}</small></p>`:''}`}
<div id="dvsum">${sumHtml(c)}</div>
${PV.s?'':shopsHtml()}
${c.cr>0?`<p class="r">عند التقسيم، المستحقات الحالية غير المسددة للبند نفسه تُرحّل إلى ق/ على نفس الوحدة، ثم يُنشأ المستحق الجديد في ح/.</p>`:''}
<button class="p" onclick="divide()">قسّم</button></div>`};

async function divide(){
 if(BUSY||!PV)return;
 const c=pvCalc();
 if(!(c.t>0)||!PV.m){MSG='أدخل الإجمالي والشهر';draw();return}
 if(!c.n){MSG='لا توجد وحدات مشاركة في هذا البند';draw();return}
 const shops=PV.s?{}:Object.fromEntries(D.units.filter(u=>u.kind==='shop').map(u=>[u.id,Math.round(+((PV.sh||{})[u.id]||0)*100)]));
 const exceptions=PV.s?[]:Object.fromEntries(PV.xs.map(x=>[x.id,(x.why||'').trim()]));
 BUSY=true;
 const r=await rpc('fn_issue_charge',{p_item:PV.item,p_period:PV.m,p_total:c.t,p_unit:PV.s||null,p_exceptions:exceptions,p_shops:shops});
 BUSY=false;
 if(r){const d=r.d||{};MSG='تم التقسيم: '+d.units+' شقة × '+P(d.rounded)+(d.diff?' | فرق التقريب '+P(d.diff):'')+(d.carried?' | رُحِّل '+d.carried+' مستحقًا غير مسدد إلى ق/':'');PV=null;await go()}}

async function doExp(){if(BUSY)return;const a=Math.round(+$('#ea').value*100);if(!(a>0)||!$('#ew').value){MSG='أكمل البيانات';draw();return}
 const ex=!!$('#ex')?.checked;if(ex&&!await reauth()){MSG='كلمة المرور غير صحيحة';draw();return}
 BUSY=true;let paths=[];const files=[...($('#ef')?.files||[])];
 for(let i=0;i<files.length;i++){
   const f=files[i];const ext=((f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg');
   const path=IDEM+'_'+(i+1)+'.'+ext;
   const{error}=await sb.storage.from('invoices').upload(path,f,{contentType:f.type||'application/octet-stream'});
   if(error&&!/exist|duplicate/i.test(error.message)){BUSY=false;MSG='تعذر رفع إحدى الفواتير: '+error.message;draw();return}
   paths.push(path);
 }
 const path=paths.join(',');
 const r=await rpc('fn_expense',{p_amount:a,p_reason:$('#ew').value,p_category:$('#ei').value,p_who:$('#eb').value,p_idem:IDEM,p_exception:ex,p_note:$('#en').value||null,p_invoice:path});BUSY=false;
 if(r){if(r.d==null)MSG='غير مصرح — تم تسجيل المحاولة';else{IDEM=crypto.randomUUID();MSG='تم التسجيل'}await go()}}
async function inv(p){
 const paths=String(p||'').split(',').map(x=>x.trim()).filter(Boolean);
 if(!paths.length){MSG='لا توجد فاتورة مرفقة';draw();return}
 for(const path of paths){
   const{data,error}=await sb.storage.from('invoices').createSignedUrl(path,300);
   if(error){MSG='تعذر فتح إحدى الفواتير: '+error.message;draw();return}
   window.open(data.signedUrl,'_blank')
 }
}

const addPanel=()=>`<div class="card" style="border:2px solid var(--gold)"><h2>➕ إضافة مستحق — ${nm(AD.k)}</h2><select id="adi">${ITEMS.map(x=>`<option>${x}</option>`).join('')}<option>مستحق قديم</option></select><input id="ada" type="number" min="0.01" step="0.01" placeholder="المبلغ بالجنيه"><input id="adm" type="month" value="${new Date().toISOString().slice(0,7)}"><input id="adr" placeholder="ملاحظة (للمستحق القديم)"><button class="p" onclick="saveAdd()">حفظ</button><button onclick="AD=null;draw()">إلغاء</button></div>`;
async function saveAdd(){if(BUSY||!AD)return;const item=$('#adi').value,a=Math.round(+$('#ada').value*100),m=$('#adm').value;
 if(!(a>0)){MSG='أدخل مبلغًا صحيحًا';draw();return}
 BUSY=true;let r;
 if(item=='مستحق قديم')r=await rpc('fn_add_old',{p_unit:AD.k,p_amount:a,p_date:null,p_reason:$('#adr').value||null});
 else{if(!m){BUSY=false;MSG='اختر الشهر';draw();return}r=await rpc('fn_issue_charge',{p_item:item,p_period:m,p_total:a,p_unit:AD.k,p_exceptions:[],p_shops:{}})}
 BUSY=false;if(r){MSG='تمت الإضافة';AD=null;await go()}}
async function chName(){const v=$('#nu').value.trim();if(!v){MSG='اكتب الاسم المطلوب';draw();return}const r=await rpc('fn_change_username',{p_new:v});if(r){if(ME)ME.username=v.toLowerCase();MSG='تم تغيير اسم المستخدم';await go()}}
init();
</script></body></html>
