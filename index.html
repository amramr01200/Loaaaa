<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>برج الباشا لؤلؤة</title>
<style>
:root{--bg:#e9ebee;--card:#fff;--tx:#1d2330;--gold:#a67c00;--red:#c62828;--grn:#2e7d32;--sv:#c9ced6;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f26;--card:#2a2e38;--tx:#eceef2;--gold:#e0b84a;--sv:#3a3f4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1f26;--card:#2a2e38;--tx:#eceef2;--gold:#e0b84a;--sv:#3a3f4b;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs) Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--sv),var(--card));border-bottom:3px solid var(--gold);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
h1{margin:0;color:var(--gold);font-size:1.3em}h2{color:var(--gold);margin:.4em 0}main{padding:10px;max-width:1000px;margin:auto}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px}
button,select,input,textarea{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--sv);background:var(--card);color:var(--tx);margin:3px;max-width:100%}
button{background:var(--sv);cursor:pointer;white-space:nowrap}button.on,button.p{background:var(--gold);color:#fff;border-color:var(--gold)}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 4px #0002}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.k{background:var(--bg);border-radius:10px;padding:8px;text-align:center}.k b{display:block;color:var(--gold);font-size:1.2em}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--sv);padding:6px;text-align:right}th{color:var(--gold)}
.r{color:var(--red);font-weight:bold}.ok{color:var(--grn);font-weight:bold}.msg{background:var(--gold);color:#fff;padding:8px;border-radius:8px;margin:8px 0}
@media print{header,nav,button{display:none}}
</style></head><body>
<header><h1>🏢 برج الباشا لؤلؤة</h1><div id="top"></div></header><div id="nav"></div><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://witqpysweqgnkmjnmozo.supabase.co',SB_KEY='sb_publishable_2iTUZk6rbk3a79RRnfSfOA_jYhqr_ED';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=n=>(Number(n)/100).toLocaleString('ar-EG')+' ج.م';
const T=s=>new Date(s).toLocaleString('ar-EG');
const ITEMS=['المياه','الكهرباء','الأسانسير','صيانة العمارة','التصالح','الحارس','مصاريف أخرى'];
let ME,D={units:[],dues:[],pay:[],exp:[],notes:[],log:[],rnd:[],cash:0},TAB='dash',MSG='',OUT='',PV=null,PU='a1',IDEM=crypto.randomUUID(),BUSY=false;
const staff=()=>ME&&ME.role!='owner',admin=()=>ME&&ME.role=='admin';
const nm=k=>{const u=D.units.find(x=>x.id==k);return u?(u.kind=='shop'?'محل ':'شقة ')+u.num:k};
const rem=d=>d.amount-d.paid,owed=k=>D.dues.filter(d=>d.unit_id==k).reduce((a,d)=>a+rem(d),0);
async function rpc(n,a){const{data,error}=await sb.rpc(n,a);if(error){MSG='خطأ: '+error.message;draw();return null}return{d:data}}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}}
function fs(d){const v=Math.max(12,Math.min(30,(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||16)+d));document.documentElement.style.setProperty('--fs',v+'px');try{localStorage.setItem('fs',v)}catch(e){}}
async function init(){try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t;const f=localStorage.getItem('fs');if(f)document.documentElement.style.setProperty('--fs',f+'px')}catch(e){}
 const{data:{session}}=await sb.auth.getSession();if(session)await boot();else draw()}
async function boot(){const{data:{user}}=await sb.auth.getUser();const{data}=await sb.from('profiles').select('*').eq('id',user?.id).maybeSingle();
 if(!data){await sb.auth.signOut();ME=null;MSG='الحساب غير مفعّل';draw();return}ME=data;TAB=staff()?'dash':'mine';await load();draw()}
async function load(){const g=async(t,o)=>{let r=sb.from(t).select('*');if(o)r=r.order(o,{ascending:false});const{data,error}=await r;if(error)MSG='تعذر تحميل '+t+': '+error.message;return data||[]};
 D.units=(await g('units')).sort((a,b)=>a.kind==b.kind?a.num-b.num:a.kind<b.kind?-1:1);D.dues=await g('dues');D.pay=await g('payments','paid_at');D.notes=await g('notes','created_at');
 if(staff()){D.exp=await g('expenses','spent_at');D.log=await g('audit_log','at');D.rnd=await g('rounding_diffs','created_at');const r=await sb.rpc('fn_cash');D.cash=r.data||0}}
async function login(){const u=$('#lu').value.trim(),email=u.includes('@')?u:u.toLowerCase()+'@pasha.example.com';
 const{error}=await sb.auth.signInWithPassword({email,password:$('#lp').value});if(error){$('#e').textContent='بيانات غير صحيحة';return}await boot()}
async function logout(){await sb.auth.signOut();ME=null;draw()}
async function chpw(){const p=$('#np').value;if(p.length<8){$('#e').textContent='8 أحرف على الأقل';return}
 const{error}=await sb.auth.updateUser({password:p});if(error){$('#e').textContent=error.message;return}
 const r=await rpc('fn_pw_done');if(r){ME.must_change=false;draw()}}
async function reauth(){const pw=$('#ra')?.value;if(!pw)return false;const{data:{user}}=await sb.auth.getUser();const{error}=await sb.auth.signInWithPassword({email:user.email,password:pw});return !error}
function draw(){
 $('#top').innerHTML=(ME?`<span>${admin()?'🦁 ':''}${E(ME.username)}</span> `:'')+`<button onclick="fs(2)">أ+</button><button onclick="fs(-2)">أ-</button><button onclick="setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark')">◐</button>`+(ME?'<button onclick="go()">تحديث</button><button onclick="logout()">خروج</button>':'');
 if(!ME){$('#nav').innerHTML='';$('#app').innerHTML=(MSG?`<div class="msg">${E(MSG)}</div>`:'')+`<div class="card"><h2>تسجيل الدخول</h2><input id="lu" placeholder="اسم المستخدم أو البريد" dir="ltr"><input id="lp" type="password" placeholder="كلمة المرور"><button class="p" onclick="login()">دخول</button><p class="r" id="e"></p></div>`;MSG='';return}
 if(ME.must_change){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card"><h2>تغيير كلمة المرور</h2><input id="np" type="password" placeholder="كلمة مرور جديدة"><button class="p" onclick="chpw()">حفظ</button><p class="r" id="e"></p></div>`;return}
 const N=staff()?[['dash','لوحة التحكم'],['units','الوحدات'],['dues','المستحقات'],['pay','تحصيل وسداد'],['exp','المصروفات'],['notes','الملاحظات'],['log','السجل']].concat(admin()?[['acc','الحسابات']]:[]):[['mine','حسابي'],['notes','الملاحظات']];
 $('#nav').innerHTML='<nav>'+N.map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';OUT='';PV=null;draw()">${t[1]}</button>`).join('')+'</nav>';
 $('#app').innerHTML=(MSG?`<div class="msg">${E(MSG)}</div>`:'')+(OUT?`<div class="card"><button onclick="print()">🖨 طباعة</button><button onclick="OUT='';draw()">إغلاق</button>${OUT}</div>`:'')+V[TAB]();MSG=''}
async function go(){await load();draw()}
const V={};
V.dash=()=>{const cur=D.dues.filter(d=>d.list=='current').reduce((a,d)=>a+rem(d),0),old=D.dues.filter(d=>d.list=='old').reduce((a,d)=>a+rem(d),0),col=D.pay.reduce((a,p)=>a+p.amount,0),ex=D.exp.reduce((a,p)=>a+p.amount,0),late=D.units.filter(u=>owed(u.id)>0);
 return `<div class="g"><div class="k">الوحدات<b>${D.units.length}</b></div><div class="k">مسددة<b class="ok">${D.units.length-late.length}</b></div><div class="k">متأخرة<b class="r">${late.length}</b></div><div class="k">ح/ المتبقي<b>${P(cur)}</b></div><div class="k">ق/ المتبقي<b>${P(old)}</b></div><div class="k">التحصيلات<b>${P(col)}</b></div><div class="k">المصروفات<b>${P(ex)}</b></div><div class="k">الرصيد النقدي<b>${P(D.cash)}</b></div></div>
 <div class="card"><h2>حالة الوحدات</h2><div class="w"><table><tr><th>الوحدة</th><th>المالك</th><th>المتبقي</th><th></th></tr>${D.units.map(u=>`<tr><td>${nm(u.id)}</td><td>${E(u.owner_name)}</td><td>${P(owed(u.id))}</td><td>${owed(u.id)>0?'<span class="r">✗</span>':'<span class="ok">✓</span>'}</td></tr>`).join('')}</table></div></div>`};
V.units=()=>`<div class="card"><h2>الوحدات</h2><input id="q" placeholder="بحث" oninput="const q=this.value;document.querySelectorAll('#ut tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')"><div class="w"><table id="ut"><tr><th>الوحدة</th><th>المالك</th><th>الجوال</th><th></th></tr>${D.units.map(u=>`<tr data-s="${E(nm(u.id)+u.owner_name+u.phone)}"><td>${nm(u.id)}</td><td><input id="o${u.id}" value="${E(u.owner_name)}"></td><td><input id="p${u.id}" value="${E(u.phone)}" dir="ltr"></td><td><button onclick="eu('${u.id}')">حفظ</button><button onclick="stm('${u.id}')">كشف</button></td></tr>`).join('')}</table></div></div>`;
async function eu(k){const r=await rpc('fn_edit_unit',{p_id:k,p_owner:$('#o'+k).value,p_phone:$('#p'+k).value});if(r){MSG='تم الحفظ';await go()}}
function stT(k){const Dd=D.dues.filter(d=>d.unit_id==k),Pp=D.pay.filter(p=>p.unit_id==k);
 return `<div class="w"><table><tr><th>النوع</th><th>البند</th><th>الفترة</th><th>المبلغ</th><th>المسدد</th><th>المتبقي</th></tr>${Dd.map(d=>`<tr><td>${d.list=='old'?'ق/':'ح/'}</td><td>${E(d.item)}</td><td>${E(d.period||d.due_date)}</td><td>${P(d.amount)}</td><td>${P(d.paid)}</td><td class="${rem(d)>0?'r':'ok'}">${P(rem(d))}</td></tr>`).join('')}</table></div><p><b>إجمالي المتبقي: ${P(owed(k))}</b></p><div class="w"><table><tr><th>إيصال</th><th>التاريخ</th><th>المبلغ</th></tr>${Pp.map(p=>`<tr><td>${p.receipt_no}</td><td>${T(p.paid_at)}</td><td>${P(p.amount)}</td></tr>`).join('')}</table></div>`}
function stm(k){const u=D.units.find(x=>x.id==k);OUT=`<h2>برج الباشا لؤلؤة — كشف حساب ${nm(k)}</h2><p>المالك: ${E(u.owner_name)} | طُبع: ${T(new Date())} بواسطة ${E(ME.username)}</p>`+stT(k);draw()}
V.mine=()=>{const k=ME.unit_id;const u=D.units.find(x=>x.id==k);return `<div class="card"><h2>${nm(k)} — ${E(u?.owner_name)}</h2>${stT(k)}</div>`};
V.dues=()=>`<div class="card"><h2>إصدار مستحقات ح/</h2><select id="di">${ITEMS.map(x=>`<option>${x}</option>`).join('')}</select><input id="dt" type="number" min="0" step="0.01" placeholder="الإجمالي بالجنيه"><input id="dm" type="month"><select id="ds"><option value="">مشترك (حسب القواعد)</option>${D.units.map(u=>`<option value="${u.id}">وحدة محددة: ${nm(u.id)}</option>`).join('')}</select><button onclick="pv()">معاينة</button>${PV?`<p>الوحدات: ${PV.n} | النصيب قبل التقريب: ${P(PV.sh)} | بعده: ${P(PV.rd)}<br>إجمالي المفروض: ${P(PV.rd*PV.n)} | فرق التقريب: ${P(PV.rd*PV.n-PV.t)}</p><button class="p" onclick="apv()">اعتماد</button>`:''}</div>
<div class="card"><h2>مستحق قديم ق/</h2><select id="ou">${D.units.map(u=>`<option value="${u.id}">${nm(u.id)}</option>`).join('')}</select><input id="oa" type="number" min="0" step="0.01" placeholder="المبلغ"><input id="od" type="date"><input id="ow" placeholder="السبب"><button class="p" onclick="addOld()">إضافة</button></div>
<div class="card"><h2>ترحيل المتبقي</h2><p>ينقل غير المسدد من ح/ إلى ق/ دون أي حركة مالية.</p><button onclick="carry()">ترحيل</button></div>`;
function pv(){const item=$('#di').value,t=Math.round(+$('#dt').value*100),s=$('#ds').value;if(!(t>0)||!$('#dm').value){MSG='أدخل المبلغ والشهر';draw();return}
 const n=s?1:D.units.filter(u=>u.kind=='apartment'&&(item!='الأسانسير'||u.num>=4)).length,sh=Math.ceil(t/n),rd=s?t:Math.ceil(sh/1000)*1000;PV={item,t,n,sh,rd,s,m:$('#dm').value};draw()}
async function apv(){if(BUSY||!PV)return;BUSY=true;const r=await rpc('fn_issue_charge',{p_item:PV.item,p_period:PV.m,p_total:PV.t,p_unit:PV.s||null});BUSY=false;if(r){PV=null;MSG='تم الاعتماد';await go()}}
async function addOld(){const a=Math.round(+$('#oa').value*100);if(!(a>0))return;const r=await rpc('fn_add_old',{p_unit:$('#ou').value,p_amount:a,p_date:$('#od').value||null,p_reason:$('#ow').value});if(r){MSG='تمت الإضافة';await go()}}
async function carry(){const r=await rpc('fn_carry_over');if(r){MSG='تم ترحيل '+r.d+' بند';await go()}}
V.pay=()=>`<div class="card"><h2>تحصيل وسداد</h2><select onchange="PU=this.value;draw()">${D.units.map(u=>`<option value="${u.id}" ${u.id==PU?'selected':''}>${nm(u.id)} ${E(u.owner_name)}</option>`).join('')}</select><select id="pd">${D.dues.filter(d=>d.unit_id==PU&&rem(d)>0).map(d=>`<option value="${d.id}">${d.list=='old'?'ق/':'ح/'} ${E(d.item)} — متبقي ${P(rem(d))}</option>`).join('')}</select><input id="pa" type="number" min="0" step="0.01" placeholder="المبلغ المحصل"><input id="pn" placeholder="ملاحظات"><button class="p" id="pb" onclick="doPay()">تأكيد التحصيل</button></div>`;
async function doPay(){if(BUSY)return;const a=Math.round(+$('#pa').value*100),d=$('#pd').value;if(!d||!(a>0)){MSG='بيانات غير مكتملة';draw();return}
 BUSY=true;$('#pb').disabled=true;const r=await rpc('fn_pay',{p_due:d,p_amount:a,p_note:$('#pn').value,p_idem:IDEM});BUSY=false;
 if(r){IDEM=crypto.randomUUID();await load();OUT=`<h2>برج الباشا لؤلؤة — إيصال قبض رقم ${r.d}</h2><p>${nm(PU)} — المبلغ ${P(a)} <span class="ok">✓</span><br>${T(new Date())} — ${E(ME.username)}</p>`;MSG='تم التحصيل';draw()}else{const b=$('#pb');if(b)b.disabled=false}}
V.exp=()=>`<div class="card"><h2>صندوق C — المصروفات</h2><p>الرصيد المتاح: <b>${P(D.cash)}</b></p><input id="ea" type="number" min="0" step="0.01" placeholder="المبلغ"><input id="ew" placeholder="السبب"><input id="ei" placeholder="البند"><input id="eb" placeholder="المستفيد">${admin()?'<label><input type="checkbox" id="ex"> استثناء (رصيد غير كاف)</label><input id="ra" type="password" placeholder="كلمة مرورك للتأكيد">':''}<button class="p" id="eb2" onclick="doExp()">تسجيل</button></div>
${admin()?`<div class="card"><h2>الرصيد الافتتاحي / تسوية</h2><input id="oa2" type="number" step="0.01" placeholder="المبلغ"><input id="or" placeholder="السبب"><button onclick="opening()">حفظ</button></div>`:''}
<div class="card"><div class="w"><table><tr><th>رقم</th><th>التاريخ</th><th>المبلغ</th><th>السبب</th><th>المستفيد</th></tr>${D.exp.map(e=>`<tr><td>${e.expense_no}</td><td>${T(e.spent_at)}</td><td>${P(e.amount)}</td><td>${E(e.reason)}</td><td>${E(e.beneficiary)}</td></tr>`).join('')}</table></div></div>`;
async function doExp(){if(BUSY)return;const a=Math.round(+$('#ea').value*100);if(!(a>0)||!$('#ew').value){MSG='أكمل البيانات';draw();return}
 const ex=!!$('#ex')?.checked;if(ex&&!await reauth()){MSG='كلمة المرور غير صحيحة';draw();return}
 BUSY=true;const r=await rpc('fn_expense',{p_amount:a,p_reason:$('#ew').value,p_category:$('#ei').value,p_who:$('#eb').value,p_idem:IDEM,p_exception:ex});BUSY=false;if(r){IDEM=crypto.randomUUID();MSG='تم التسجيل';await go()}}
async function opening(){if(!await reauth()){MSG='أدخل كلمة مرورك في خانة التأكيد بشاشة المصروفات';draw();return}const r=await rpc('fn_set_opening',{p_amount:Math.round(+$('#oa2').value*100),p_reason:$('#or').value});if(r){MSG='تم';await go()}}
V.notes=()=>`<div class="card"><h2>الملاحظات</h2><textarea id="nt" rows="3" placeholder="نص الملاحظة"></textarea>${staff()?'<label><input type="checkbox" id="ng"> إعلان عام</label>':''}<button class="p" onclick="note()">إرسال</button></div>`+D.notes.filter(n=>!n.hidden||staff()).map(n=>`<div class="card"><b>${E(n.author_name)}</b> ${n.is_public?'(إعلان عام)':nm(n.unit_id)} — ${T(n.created_at)}${n.hidden?' (مخفية)':''}<p>${E(n.body)}</p>${admin()&&!n.hidden?`<button onclick="hide('${n.id}')">إخفاء</button>`:''}</div>`).join('');
async function note(){const b=$('#nt').value.trim();if(!b)return;const pub=!!$('#ng')?.checked;const{error}=await sb.from('notes').insert({body:b,is_public:pub,unit_id:pub?null:(ME.unit_id||null),author_name:ME.username});if(error)MSG='خطأ: '+error.message;else MSG='تم الإرسال';await go()}
async function hide(id){const r=await rpc('fn_hide_note',{p_id:id});if(r)await go()}
V.log=()=>`<div class="card"><h2>سجل التدقيق</h2><div class="w"><table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr>${D.log.map(l=>`<tr><td>${T(l.at)}</td><td>${l.actor_role=='admin'?'🦁 ':''}${E(l.actor_name)}</td><td>${E(l.action)}</td><td dir="ltr">${E(JSON.stringify(l.detail))}</td></tr>`).join('')}</table></div></div><div class="card"><h2>فروق التقريب</h2>${D.rnd.map(r=>`<p>${E(r.period)} ${E(r.item)}: ${P(r.amount)}</p>`).join('')||'—'}</div>`;
V.acc=()=>`<div class="card"><h2>الحسابات</h2><p>إنشاء حسابات الشقق والمحلات التي ليس لها حساب بعد (كلمات مرور عشوائية تظهر مرة واحدة).</p><button class="p" onclick="mk({})">إنشاء حسابات الوحدات</button><br><input id="su" placeholder="اسم مشرف جديد" dir="ltr"><button onclick="mk({supervisor:$('#su').value.trim()})">إنشاء مشرف</button></div>`;
async function mk(b){const{data,error}=await sb.functions.invoke('bright-action',{body:b});if(error||data?.error){MSG='خطأ: '+(data?.error||error.message);draw();return}
 OUT='<h2>كلمات المرور المؤقتة (تظهر مرة واحدة)</h2><table><tr><th>المستخدم</th><th>كلمة المرور</th></tr>'+(data.created||[]).map(x=>`<tr><td dir="ltr">${E(x.user)}</td><td dir="ltr">${E(x.password)}</td></tr>`).join('')+'</table>';draw()}
init();
</script></body></html>
